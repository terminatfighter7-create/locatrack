<title>Bienvenue sur LOCA'TRACK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--noir:#000;--carte:#0d0d10;--bord:#2a1a0e;--orange:#ff7a00;--orange-vif:#ff9a1f;--texte:#f5f5f5;--discret:#a8a8ad}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#1c0f05 0%,var(--noir) 60%) no-repeat,var(--noir);color:var(--texte);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:520px;text-align:center}
.logo{width:150px;height:150px;border-radius:24%;display:block;margin:0 auto 28px;box-shadow:0 0 40px rgba(255,122,0,.25)}
h1{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:800;margin-bottom:12px}
h1 span{color:var(--orange)}
.intro{color:var(--discret);margin-bottom:32px}
ol{list-style:none;padding:0;display:grid;gap:14px;text-align:left}
li{background:var(--carte);border:1px solid var(--bord);border-left:4px solid var(--orange);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
li b{font-size:1.05rem}
.btn{display:inline-block;background:var(--orange);color:#000;font-weight:700;text-decoration:none;padding:10px 18px;border-radius:8px;transition:background .15s}
.btn:hover{background:var(--orange-vif)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.off{background:#3a2a1c;color:#9a8a7a;pointer-events:none}
.note{margin-top:28px;font-style:italic;color:var(--orange)}
</style>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); } catch(e){}
  }
  // Tutoriel : à renseigner quand il sera prêt (lien t.me/c/... ou autre)
  var TUTO_URL = '';
  var tuto = document.getElementById('lien-tuto');
  if (!TUTO_URL) {
    tuto.textContent = 'Bientôt disponible';
    tuto.classList.add('off');
    tuto.setAttribute('aria-disabled','true');
  } else {
    tuto.href = TUTO_URL;
    tuto.addEventListener('click', function(e){
      if (tg && /^https:\/\/t\.me\//.test(TUTO_URL)) {
        e.preventDefault();
        tg.openTelegramLink(TUTO_URL);
      }
    });
  }
})();
</script>
